[package]
name = "wtmux"
version = "3.0.1"
edition = "2021"
rust-version = "1.70"
description = "A tmux-like terminal multiplexer for Windows, macOS and Linux"
authors = ["wtmux contributors"]
license = "MIT"
repository = "https://github.com/fukuyori/wtmux"
homepage = "https://github.com/fukuyori/wtmux"
documentation = "https://github.com/fukuyori/wtmux#readme"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tmux", "windows", "conpty"]
categories = ["command-line-utilities"]

[dependencies]
# Terminal rendering
crossterm = "0.27"

# Unicode width calculation
unicode-width = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Bit flags
bitflags = "2.4"

# Clipboard
arboard = "3.4"

[target.'cfg(unix)'.dependencies]
# POSIX pty (openpty, ioctl, signals)
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[build-dependencies]
winres = "0.1"

[[bin]]
name = "wtmux"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "wtmux contributors"
copyright = "2024, wtmux contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
A tmux-like terminal multiplexer for Windows, macOS and Linux."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/wtmux", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/wtmux/README.md", "644"],
    ["config.example.toml", "usr/share/doc/wtmux/config.example.toml", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/wtmux", dest = "/usr/bin/wtmux", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/wtmux/README.md", mode = "644", doc = true },
    { source = "config.example.toml", dest = "/usr/share/doc/wtmux/config.example.toml", mode = "644", doc = true },
]
